<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 240" width="1100" height="240" role="img" aria-label="Cómo se usa: elige tu USB, elige el formato, respalda y formatea" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <title>Cómo se usa GrifoFormat</title>
  <g transform="translate(20 20)">
    <rect width="320" height="200" rx="20" fill="#181B2E" stroke="#D4AF37" stroke-opacity=".5" stroke-width="2"/>
    <circle cx="44" cy="46" r="22" fill="#D4AF37"/><text x="44" y="54" text-anchor="middle" font-size="24" font-weight="700" fill="#0D0F1A">1</text>
    <text x="80" y="54" font-size="24" font-weight="700" fill="#E8E2D0">Elige tu USB</text>
    <text x="28" y="108" font-size="18" fill="#969282">Conéctala y selecciónala</text>
    <text x="28" y="134" font-size="18" fill="#969282">en la lista de unidades.</text>
    <g transform="translate(0 16)"><rect x="244" y="134" width="46" height="14" rx="3" fill="#94A3BE"/><rect x="236" y="146" width="62" height="34" rx="9" fill="#D4AF37"/></g>
  </g>
  <path d="M350 120 h40 m-12 -12 l12 12 l-12 12" fill="none" stroke="#D4AF37" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(390 20)">
    <rect width="320" height="200" rx="20" fill="#181B2E" stroke="#D4AF37" stroke-opacity=".5" stroke-width="2"/>
    <circle cx="44" cy="46" r="22" fill="#D4AF37"/><text x="44" y="54" text-anchor="middle" font-size="24" font-weight="700" fill="#0D0F1A">2</text>
    <text x="80" y="54" font-size="24" font-weight="700" fill="#E8E2D0">Elige el formato</text>
    <text x="28" y="108" font-size="18" fill="#969282">FAT32, exFAT o NTFS, y</text>
    <text x="28" y="134" font-size="18" fill="#969282">el nombre del volumen.</text>
    <g transform="translate(0 16)" font-size="15" font-weight="700" fill="#0D0F1A">
      <rect x="196" y="140" width="98" height="40" rx="10" fill="#D4AF37"/><text x="245" y="165" text-anchor="middle">FAT32</text>
    </g>
  </g>
  <path d="M720 120 h40 m-12 -12 l12 12 l-12 12" fill="none" stroke="#D4AF37" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(760 20)">
    <rect width="320" height="200" rx="20" fill="#181B2E" stroke="#D4AF37" stroke-opacity=".5" stroke-width="2"/>
    <circle cx="44" cy="46" r="22" fill="#D4AF37"/><text x="44" y="54" text-anchor="middle" font-size="24" font-weight="700" fill="#0D0F1A">3</text>
    <text x="80" y="54" font-size="24" font-weight="700" fill="#E8E2D0">Respalda y formatea</text>
    <text x="28" y="108" font-size="18" fill="#969282">Elige dónde guardar la copia</text>
    <text x="28" y="134" font-size="18" fill="#969282">y listo. Sin sorpresas.</text>
    <g transform="translate(0 16)"><rect x="196" y="148" width="98" height="12" rx="6" fill="#0D0F1A"/><rect x="196" y="148" width="68" height="12" rx="6" fill="#D4AF37"/></g>
  </g>
</svg>
