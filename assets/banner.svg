<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="GrifoFormat - Guardián de tus memorias USB">
  <title>GrifoFormat</title>
  <defs>
    <linearGradient id="bn" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0D0F1A"/><stop offset="1" stop-color="#1B1F3A"/></linearGradient>
    <linearGradient id="gd" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F3D77A"/><stop offset="1" stop-color="#D4AF37"/></linearGradient>
    <linearGradient id="ic" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F3D77A"/><stop offset="1" stop-color="#B8921F"/></linearGradient>
  </defs>
  <rect width="1280" height="320" rx="28" fill="url(#bn)"/>
  <circle cx="1130" cy="40" r="190" fill="#D4AF37" fill-opacity=".08"/>
  <circle cx="1230" cy="300" r="150" fill="#D4AF37" fill-opacity=".06"/>
  <!-- icono: memoria USB con rombo dorado -->
  <g transform="translate(60 40)">
    <rect width="240" height="240" rx="56" fill="#181B2E" stroke="#D4AF37" stroke-width="4"/>
    <rect x="86" y="30" width="68" height="52" rx="8" fill="#94A3BE"/>
    <rect x="100" y="44" width="12" height="16" rx="3" fill="#181B2E"/><rect x="128" y="44" width="12" height="16" rx="3" fill="#181B2E"/>
    <rect x="66" y="78" width="108" height="140" rx="22" fill="url(#ic)"/>
    <polygon points="120,118 148,148 120,178 92,148" fill="#0D0F1A"/>
  </g>
  <g font-family="'Georgia', 'Times New Roman', serif">
    <text x="350" y="150" font-size="84" font-weight="700" fill="url(#gd)">GrifoFormat</text>
    <text x="352" y="204" font-size="30" font-style="italic" fill="#CBD5E1">Guardián de tus memorias USB</text>
  </g>
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" fill="#E8E2D0">
    <rect x="352" y="232" width="150" height="40" rx="20" fill="#fff" fill-opacity=".08"/><text x="427" y="258" text-anchor="middle">Windows</text>
    <rect x="518" y="232" width="110" height="40" rx="20" fill="#fff" fill-opacity=".08"/><text x="573" y="258" text-anchor="middle">C++</text>
    <rect x="644" y="232" width="230" height="40" rx="20" fill="#fff" fill-opacity=".08"/><text x="759" y="258" text-anchor="middle">FAT32 hasta 2 TB</text>
    <rect x="890" y="232" width="200" height="40" rx="20" fill="#fff" fill-opacity=".08"/><text x="990" y="258" text-anchor="middle">Con respaldo</text>
  </g>
